[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[project]
name = "zetro-daily-recommendations"
version = "1.0.0"
description = "Research paper recommendations with email triage and confirmed Zotero saving"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
    "gitignore-parser>=0.1.11",
    "tiktoken>=0.8.0",
    "feedparser>=6.0.11",
    "hydra-core>=1.3.2",
    "aiosmtpd>=1.4.6",
    "loguru>=0.7.3",
    "pyzotero>=1.10.0",
    "scikit-learn>=1.7.1",
    "sentence-transformers>=5.2.3",
    "torch",
    "openai>=2.24.0",
    "arxiv>=2.4.0",
    "pymupdf4llm>=0.3.4",
    "pymupdf-layout>=1.27.1",
    "dotenv>=0.9.9",
    "peft>=0.18.1",
    "trafilatura>=2.0.0",
]

[project.urls]
Repository = "https://github.com/Yuna-Nexus/zetro-daily-recommendations"
Upstream = "https://github.com/TideDra/zotero-arxiv-daily"

[tool.uv.build-backend]
module-name = "zotero_arxiv_daily"
source-include = ["config/**", "feedback/*.js", "feedback/*.sql", "feedback/*.toml", "feedback/package*.json", "docs/**", "tests/**", "README.upstream.md", "MODIFICATIONS.md", ".github/workflows/*.yml", "uv.lock", ".python-version", ".env.example"]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: tests that are slow (e.g. download models)",
]
filterwarnings = [
    "ignore::DeprecationWarning:multiprocessing",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.0",
]
